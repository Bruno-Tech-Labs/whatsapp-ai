spring.application.name=api

# WhatsApp Cloud API - webhook
# Definido por voce no painel da Meta e aqui precisam ser identicos.
whatsapp.webhook.verify-token=${WHATSAPP_VERIFY_TOKEN:changeme}

# App Secret do app criado no Meta for Developers (nao e o Access Token).
whatsapp.app-secret=${WHATSAPP_APP_SECRET:changeme}

# Porta usada pelo Render; localmente será 8080 se PORT não existir.
server.port=${PORT:8080}

# Token de acesso do WhatsApp Cloud API, gerado no painel da Meta for Developers.
whatsapp.cloud.access-token=${WHATSAPP_CLOUD_ACCESS_TOKEN:changeme}

# ID do número de telefone do WhatsApp Cloud API, gerado no painel da Meta for Developers.
whatsapp.cloud.phone-number-id=${WHATSAPP_CLOUD_PHONE_NUMBER_ID:changeme}

logging.level.com.brunotech=INFO
